<meta name="claude:viewport-fit-sides" content="cover">
<title>무삭제 시네마 제작소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* 극장 로비 한 가지 세계라 다크 단일 테마. 색은 전부 토큰, 장식은 전부 그림 에셋(a/*.webp). */
:root{color-scheme:dark;
--bg:#140a0d;--bg2:#1d1015;--wine:#6e1226;--wine-l:#a8283f;
--gold:#d9b25c;--gold-d:#8a6a28;--cream:#f3ead8;--cream2:#e7d9bd;
--ink:#3b2218;--ink2:#6b4a3a;--mut:#8a6f60;--lt:#f5e6c8;--lt2:#cdb89a;
--ok:#2f8f78;--warn:#b5791c;--bad:#b3233a;
--f-d:'Nanum Myeongjo','Batang','Noto Serif KR',serif;
--f-b:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--lt);font:400 14px/1.5 var(--f-b);-webkit-tap-highlight-color:transparent;
padding-block:8px 48px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--f-d);margin:0;font-weight:800;text-wrap:balance}
h2{font-size:20px;color:var(--ink)}h3{font-size:14px;color:var(--wine);letter-spacing:.04em}
p{margin:0}img{display:block;max-width:100%}
.small{font-size:12px}.mut{color:var(--mut)}.gold{color:var(--gold-d)}
/* ===== 플레이트(금장 판) : 9분할 이미지 ===== */
.pl{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-style:solid;border-width:13px;border-image-slice:30 fill;border-image-width:13px;border-image-repeat:stretch;
background:none;font:600 14px/1.2 var(--f-b);padding:2px 6px;min-height:46px;cursor:pointer;touch-action:manipulation;appearance:none;-webkit-appearance:none;text-align:center}
.pl.wide{display:flex;width:100%}
.pl.gold{border-image-source:url(a/plate_01.webp);color:#3b2208}
.pl.cream{border-image-source:url(a/plate_02.webp);color:var(--ink)}
.pl.wine{border-image-source:url(a/plate_05.webp);color:var(--lt)}
.pl.gray,.pl:disabled{border-image-source:url(a/plate_03.webp);color:#6f665c;cursor:not-allowed}
.pn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-style:solid;border-width:11px;border-image-slice:26 fill;border-image-width:11px;border-image-repeat:stretch;
background:none;font:600 13px/1.25 var(--f-b);padding:1px 4px;min-height:44px;cursor:pointer;touch-action:manipulation;appearance:none;-webkit-appearance:none;text-align:center}
.pn small{font-size:10.5px;font-weight:400;opacity:.8}
.pn.cream{border-image-source:url(a/plate_08.webp);color:var(--ink)}
.pn.sel{border-image-source:url(a/plate_10.webp);color:#3b2208}
.pn.lock,.pn:disabled{border-image-source:url(a/plate_11.webp);color:#6f665c;cursor:not-allowed}
button:focus-visible,.cut:focus-visible,.in:focus-visible,.pad:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.in{width:100%;font:600 16px var(--f-d);color:var(--ink);background:rgba(255,255,255,.55);border:1px solid var(--gold-d);border-radius:6px;padding:8px 10px;text-align:center}
/* ===== 헤더(로비) ===== */
.head{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--gold-d)}
.head img.lobby{width:100%;height:auto;aspect-ratio:3/1;object-fit:cover}
.hud{position:absolute;left:6px;right:6px;top:6px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:5px}
.hp{border-style:solid;border-width:9px;border-image:url(a/plate_06.webp) 24 fill/9px stretch;min-height:40px;padding:0 4px;display:flex;flex-direction:column;justify-content:center;color:var(--ink);font-size:11px;line-height:1.2;text-align:center}
.hp.w{border-image-source:url(a/plate_05.webp);color:var(--lt)}
.hp b{font:800 14px var(--f-d);font-variant-numeric:tabular-nums}
.gbar{height:5px;border-radius:3px;background:#3a2a20;overflow:hidden;margin-top:2px;border:1px solid rgba(138,106,40,.7)}
.gbar i{display:block;height:100%;background:url(a/bar_03.webp) 0 0/100% 100%;transition:width .4s}
.gbar.dig i{background-image:url(a/bar_04.webp)}
.bkrow{display:flex;margin-bottom:4px}.bk{font:700 13px var(--f-d);color:var(--lt);background:rgba(20,10,13,.78);border:1px solid var(--gold-d);border-radius:8px;min-height:36px;padding:0 14px;cursor:pointer}.bk:disabled{color:#7a6f66;background:rgba(40,34,36,.6);cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border-style:solid;border-width:10px;border-image:url(a/plate_06.webp) 26 fill/10px stretch;min-height:40px;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-d);color:var(--ink);opacity:.9}
.tab.on{border-image-source:url(a/plate_05.webp);color:var(--lt);opacity:1}
/* ===== 본 패널 ===== */
.main{border-style:solid;border-width:34px;border-image:url(a/pbig.webp) 108 fill/34px stretch;padding:2px 6px 8px;color:var(--ink);display:flex;flex-direction:column;gap:12px;margin:-2px -4px}
.main .sub{text-align:center;font-size:12.5px;color:var(--ink2)}
.sec{display:flex;flex-direction:column;gap:6px}
.sech{display:flex;align-items:center;gap:8px;color:var(--wine)}
.sech::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold-d),transparent)}
.sech h3{font-size:15px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts .pn{flex:1 1 30%;min-width:84px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
/* 심사위원 줄 */
.jrow{display:flex;gap:8px;align-items:center}
.jp{position:relative;width:54px;height:54px;flex:none}
.jp img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);border-radius:50%;object-fit:cover;object-position:50% 20%}
.jp::after{content:'';position:absolute;inset:0;background:url(a/frame_00.webp) center/100% 100%}
.pips{font-size:11px;letter-spacing:1px;min-width:38px}
/* 주연 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px}
.card{position:relative;text-align:left;font:inherit;color:var(--ink);background:none;appearance:none;-webkit-appearance:none;cursor:pointer;touch-action:manipulation;
border-style:solid;border-width:12px;border-image:url(a/panel_06.webp) 36 fill/12px stretch;padding:0 2px 2px;display:flex;flex-direction:column;gap:3px}
.card.sel{border-image-source:url(a/plate_05.webp);color:var(--lt)}
.card:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.card .ph2{aspect-ratio:5/3.6;overflow:hidden;border-radius:4px;background:radial-gradient(90% 90% at 50% 20%,#4a1a28,#1b0d12)}
.card .ph2 img{width:100%;height:100%;object-fit:cover;object-position:50% 2%}
.card .nm{display:flex;align-items:center;gap:6px;font:800 15px var(--f-d)}
.card .nm i{font:600 11px var(--f-b);font-style:normal;color:var(--gold-d)}
.card.sel .nm i{color:var(--gold)}
.chk{margin-left:auto;width:22px;height:22px;background:url(a/plate_13.webp) 0 0/100% 100%}
.card.sel .chk,.wc.sel .chk{background-image:url(a/plate_12.webp)}
.card.sel .chk::after,.wc.sel .chk::after{content:'✓';display:grid;place-items:center;height:100%;color:#3b2208;font-weight:800;font-size:13px}
.cbar{height:5px;border-radius:3px;background:#3a2a20;overflow:hidden}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#b88a2e,#e8c870)}
/* 작가 카드 */
.wc{position:relative;text-align:left;font:inherit;color:var(--ink);background:none;appearance:none;-webkit-appearance:none;cursor:pointer;touch-action:manipulation;
border-style:solid;border-width:12px;border-image:url(a/panel_06.webp) 36 fill/12px stretch;padding:0 1px 2px;display:flex;flex-direction:column;gap:3px}
.wc.sel{border-image-source:url(a/plate_05.webp);color:var(--lt)}
.wc:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.wc img{width:100%;aspect-ratio:1/.8;object-fit:cover;object-position:50% 25%;border-radius:4px}
.wc b{font:800 14px var(--f-d)}.wc .d{font-size:11px;line-height:1.35;opacity:.85}
.wc{min-width:0}.card{min-width:0}
.wc .pr{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;font:700 13px var(--f-b)}.wc .pr span{white-space:nowrap}
/* ===== 컷 타일 ===== */
.cuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cut{position:relative;display:flex;flex-direction:column;gap:2px;padding:0;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;text-align:center;touch-action:manipulation}
.cut .fr{position:relative;aspect-ratio:3/4;border-style:solid;border-width:9px;border-image:url(a/frame_02.webp) 44/9px stretch;background:#000;overflow:hidden}
.cut .fr>img,.cut .fr>video,.cut .fr>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut .cap{font:700 11px var(--f-d);color:var(--ink)}
.cut .ty{font:500 10px var(--f-b);background:var(--wine);color:var(--lt);border-radius:3px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtag{position:absolute;left:3px;bottom:3px;z-index:2;font-size:10px;background:rgba(0,0,0,.65);color:#ffd48a;border-radius:4px;padding:0 4px}
.cut.cur .fr{outline:3px solid var(--gold);outline-offset:-2px}
.card .ph2{position:relative;cursor:pointer}
.pgnav{display:flex;align-items:center;justify-content:center;gap:10px}
.pgnav .pn{min-width:56px;min-height:36px;font-size:16px}
.edit{position:absolute;right:4px;top:4px;cursor:pointer;background:rgba(20,10,13,.72);color:var(--lt);border:1px solid var(--gold-d);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.nof{position:absolute;inset:0;display:grid;place-items:center;color:var(--lt2);font:600 12px var(--f-b)}
.cut.used .fr{outline:2px solid var(--warn);outline-offset:-1px}
.cut.picked{opacity:.32}.cut:disabled{cursor:not-allowed;opacity:.4}
.ctag{position:absolute;right:3px;top:3px;z-index:2;font-size:9.5px;background:rgba(0,0,0,.7);border-radius:4px;padding:1px 4px;color:#ffd48a}
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:1px;padding:5px;font-size:10px;line-height:1.3;color:#f5e6c8;background:linear-gradient(160deg,hsl(var(--h) 38% 28%),hsl(var(--h) 45% 12%))}
.ph b{font:800 12px var(--f-d)}.ph em{font-style:normal;color:#cdb89a;font-size:9px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-style:solid;border-width:9px;border-image:url(a/frame_02.webp) 44/9px stretch;background:rgba(59,34,24,.12);overflow:hidden}
.slot>img,.slot>video,.slot>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .role{position:absolute;left:0;right:0;top:0;text-align:center;font:700 10px var(--f-d);background:rgba(20,10,13,.62);color:var(--gold);z-index:2;padding:1px 0 1px 18px}
.slot .an{position:absolute;right:2px;top:20px;z-index:3;font:700 9.5px var(--f-b);background:rgba(20,10,13,.7);color:var(--lt);border-radius:4px;padding:0 4px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp{color:var(--gold);font-size:10px;letter-spacing:1px}
.jres{display:flex;gap:8px;align-items:center;animation:rev .5s ease-out both}
.stars{color:#d9a21b;letter-spacing:1px;font-size:13px}.stars i{font-style:normal;color:rgba(120,100,80,.35)}.stars b{color:var(--wine);font-size:12px;margin-left:4px}
.kd{font:700 10.5px var(--f-b);padding:1px 7px;border-radius:999px;border:1px solid var(--gold-d)}.kd.hit{color:#b3233a}.kd.bad{color:#555}.kd.ok{color:#2f7d62}
.slot .no{position:absolute;left:2px;top:2px;z-index:3;font:800 11px var(--f-d);background:var(--gold);color:#3b2208;border-radius:4px;padding:0 5px}
.slot .rm{position:absolute;inset:0;background:none;border:0;padding:0;cursor:pointer;z-index:1}
.slot .mv{position:absolute;left:0;right:0;bottom:0;opacity:.9;z-index:3;display:flex;justify-content:space-between;padding:2px}
.slot .mv button{font:700 11px var(--f-b);width:26px;height:22px;border-radius:5px;border:1px solid var(--gold-d);background:rgba(20,10,13,.75);color:var(--lt);cursor:pointer;padding:0}
.slot .mv button:disabled{color:#6f665c;cursor:not-allowed}
.meter{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;justify-content:center}
.meter b{font-variant-numeric:tabular-nums}
.slate{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--gold-d);background:#0c070a}
.slate .clap{height:26px;background:repeating-linear-gradient(120deg,#eee5d8 0 18px,#0c070a 18px 36px);transform-origin:left bottom;animation:clap 1.3s ease-in both}
.slate .sb{padding:12px 14px;display:flex;flex-direction:column;gap:3px;color:var(--lt)}
@keyframes clap{0%{transform:rotate(-18deg)}70%{transform:rotate(-18deg)}85%{transform:rotate(0)}100%{transform:rotate(0)}}
.reveal{animation:rev .35s ease-out both}
@keyframes rev{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ===== 시사회 무대 ===== */
.theater{position:relative;border-radius:10px;overflow:hidden;background:#12080b;border:1px solid var(--gold-d)}
.theater .val,.theater .bs{width:100%;height:auto}
.win{position:relative;aspect-ratio:4/5;background:#000;overflow:hidden}
.scr-in{position:absolute;inset:0;overflow:hidden;transition:opacity .3s}
.win.off .scr-in{opacity:0}
.win.on{animation:poweron .8s ease-out}
@keyframes poweron{0%{transform:scaleY(.015);filter:brightness(5)}55%{transform:scaleY(1);filter:brightness(2.6)}100%{filter:none}}
.pan{position:absolute;left:0;top:0;max-width:none;will-change:transform}
.pan.ph{inset:auto;justify-content:center;align-items:center;text-align:center}
.slide{position:absolute;inset:0;overflow:hidden;animation:rev .4s ease-out both}
.slide .cap2{position:absolute;right:15.5%;bottom:8px;font:700 11px var(--f-d);background:rgba(0,0,0,.6);padding:1px 7px;border-radius:4px;color:var(--lt);z-index:3}
.dr{position:absolute;top:0;bottom:0;width:14%;display:flex;flex-direction:column;pointer-events:none;z-index:4}
.dr.l{left:0}.dr.r{right:0}
.dr img{width:100%}
.dr .s0{flex:1;min-height:0;height:auto;object-fit:fill}
.dr .s1,.dr .s2{height:auto;flex:none}
.hall{position:relative;display:flex;justify-content:center;align-items:flex-end;margin-top:-8px;padding:4px 4% 0;background:linear-gradient(#12080b,#2a1019 60%,#3a1722)}
.jd{position:relative;flex:none;transform-origin:50% 100%}
.jd img{width:100%;height:auto}
.jd.flip img{transform:scaleX(-1)}
.badge{position:absolute;left:50%;bottom:7%;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:#7e8fa6;box-shadow:0 0 6px currentColor;color:#7e8fa6}
.badge.g2{background:#52b79d;color:#52b79d}.badge.g3{background:#d9b25c;color:#d9b25c}.badge.g4{background:#c8405b;color:#c8405b}
.badge.g5{background:linear-gradient(135deg,#5ee,#e7e,#fe6,#5ee);background-size:300% 300%;animation:holo 2s linear infinite;color:#e7e}
@keyframes holo{to{background-position:300% 300%}}
.jd.bob{animation:bob .8s ease-in-out 2}
.jd.shake{animation:shk .5s linear 2}
.jd.tilt{animation:tilt 1.2s ease-in-out}
.jd.creak{animation:creak .5s linear 2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3%)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
@keyframes tilt{0%,100%{transform:rotate(0)}40%,70%{transform:rotate(-4deg)}}
@keyframes creak{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
.cast{position:relative;display:grid;grid-template-columns:27% 1fr 27%;gap:2px;align-items:end;margin-top:-6px;
border-style:solid;border-width:13px;border-image:url(a/panel_07.webp) 36 fill/13px stretch;padding:0 2px 0;min-height:112px;color:var(--ink)}
.cp{position:relative;margin-top:-62px;min-width:0}
.cp img{width:100%;height:auto;aspect-ratio:1/1.12;object-fit:cover;object-position:50% 2%}
.cp .nmp{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font:700 11px var(--f-d);background:var(--wine);color:var(--lt);border-radius:4px;padding:0 8px;white-space:nowrap;border:1px solid var(--gold-d)}
.cc{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:4px}
.say{width:100%;min-height:50px;display:flex;flex-direction:column;justify-content:center;text-align:center;font:600 12.5px/1.4 var(--f-d);color:var(--ink);
border-style:solid;border-width:11px;border-image:url(a/plate_08.webp) 26 fill/11px stretch;padding:0 2px}
.say small{display:block;font:500 10px var(--f-b);color:var(--wine)}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#b8a58a}.dots i.on{background:var(--wine)}
/* 결과 */
.sc-wrap{display:flex;flex-direction:column;gap:10px}
.big{font:800 54px/1 var(--f-d);font-variant-numeric:tabular-nums;color:var(--wine)}
.fr2{display:grid;grid-template-columns:90px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
.fr2 b{font-variant-numeric:tabular-nums;text-align:right}
.quote{font-family:var(--f-d);font-size:14.5px;line-height:1.7;color:var(--ink);border-left:2px solid var(--gold-d);padding-left:10px;animation:rev .5s ease-out both}
.quote small{display:block;font-family:var(--f-b);font-size:11px;color:var(--mut)}
.notice{background:rgba(110,18,38,.1);border:1px solid var(--gold-d);border-radius:8px;padding:8px 10px;font-size:13px}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.react{display:flex;gap:4px;justify-content:center;align-items:flex-end}
.react .pt2{width:30%;max-width:130px}.react img{width:100%;height:auto}
.react.cheerr .pt2{width:30%}
/* 타이틀 */
.ttl{display:flex;flex-direction:column;gap:16px}
.ttl .hero{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--gold-d)}
.ttl .hero img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.ttl .hero div{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(20,10,13,.92));text-align:center}
.ttl h1{font-size:34px;line-height:1.15;color:var(--gold);text-shadow:0 2px 12px #000}
.ttl .sub{font:600 11px var(--f-d);letter-spacing:.3em;color:var(--lt2)}
.ttl .btns{display:flex;flex-direction:column;gap:8px;max-width:340px;width:100%;margin:0 auto}
.link{background:none;border:0;color:var(--mut);font:500 12px var(--f-b);text-decoration:underline;cursor:pointer;padding:6px 0}
/* 체벌 */
.pstage{position:relative;display:flex;flex-direction:column;gap:8px}
.exec{display:flex;gap:10px;align-items:center;border-style:solid;border-width:12px;border-image:url(a/panel_07.webp) 36 fill/12px stretch;padding:0 2px;color:var(--ink)}
.exec .jp{width:62px;height:62px}
.exec .say2{flex:1;font-family:var(--f-d);font-size:13.5px;line-height:1.5;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.exec .say2 small{font:500 10.5px var(--f-b);color:var(--wine)}
.phud{display:flex;justify-content:space-between;font-size:12.5px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.35);border:1px solid var(--gold-d);border-radius:8px;padding:4px 10px}
.lanes{position:relative;height:clamp(340px,50vh,470px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

function ingestFiles(files){
 const re=/^\s*([^()（）]+?)\s*[\(（]\s*([^)）]+?)\s*[\)）]/;
 const arr=[];let skipped=0,tsSkipped=0;CUSTOM_TIER={};const lockTmp={};
 for(const f of files){
  const isVid=/\.(mp4|m4v|webm|mov)$/i.test(f.name||'');
  if(/\.ts$/i.test(f.name||'')){tsSkipped++;continue;}
  if(!isVid&&(!f.type||!f.type.startsWith('image/'))){skipped++;continue;}
  const p=(f.rel||'').split('/');
  if(p.length<2){skipped++;continue;}
  let idx=-1,m=null;
  for(let i=0;i<p.length-1;i++){const mm=re.exec(p[i]);if(mm){idx=i;m=mm;break;}}
  const lk=x=>{const q=/#(\d)\s*$/.exec(x||'');return q?+q[1]:0;};
  let aName,place,aLock=0,tIdx,idStart;
  if(idx>=0){
   aName=m[1].trim();place=m[2].trim();
   const nm1=/^(.*?)\s*#(\d)$/.exec(aName);if(nm1){aName=nm1[1].trim();aLock=+nm1[2];}
   const tl=/^\s*#(\d)/.exec(p[idx].slice(m.index+m[0].length));if(tl)aLock=Math.max(aLock,+tl[1]);
   for(let i=0;i<idx;i++)aLock=Math.max(aLock,lk(p[i]));
   tIdx=idx+1;idStart=idx;
  }else{
   const d=p.slice(0,-1);
   if(d.length<2){skipped++;continue;}
   const ai=d.length>=4?2:1;
   const nm=d[ai].replace(/\s*#\d\s*$/,'').trim();
   if(!nm){skipped++;continue;}
   aName=nm;place='기본';aLock=Math.max(lk(d[ai]),ai===2?lk(d[1]):0);
   tIdx=ai+1;idStart=ai;
  }
  if(aLock)lockTmp[aName]=Math.max(lockTmp[aName]||0,clamp(aLock,1,5));
  const base=p[p.length-1].replace(/\.[^.]+$/,'').toLowerCase();
  if(base==='portrait'){PORTRAIT[aName]=f.mk();continue;}
  const between=p.slice(tIdx,p.length-1);
  const type=between.length?normType(between[0]):'미분류';
  arr.push({id:p.slice(idStart).join('/'),actor:aName,place,type,no:arr.length+1,kind:isVid?'video':'img',src:f.mk()});
 }
 if(!arr.length){R.folderMsg=(tsSkipped?`.ts 영상 ${fmt(tsSkipped)}개는 재생할 수 없어 건너뛰었습니다. MP4로 바꿔 주세요. `:'')+'읽을 수 있는 이미지·영상이 없습니다. 이 기기에서는 폴더 선택이 안 될 수 있어, 가짜 컷으로 진행합니다.';render();return;}
 CUTS=arr;R.realCount=arr.length;
 ACTOR_LOCK=lockTmp;
 const names=[...new Set(arr.map(c=>c.actor))];
 MINLOCK=Math.min(...names.map(n=>ACTOR_LOCK[n]||1));
 const hidden=names.filter(n=>!actorOpen(n)).length;
 R.folderMsg=`${fmt(arr.length)}개를 불러왔습니다.`+(skipped?` (제외 ${fmt(skipped)}개)`:'')+(hidden?` 숨김 배우 ${hidden}명(감독 레벨로 해금).`:'')+(tsSkipped?` .ts 영상 ${fmt(tsSkipped)}개는 재생할 수 없어 건너뛰었습니다. MP4로 바꿔 주세요.`:'');
 if(R.film)newFilm();

}

function rollJudges(){
 const h=HALLS[S.hall];const grades=shuffle(h.grades.slice());const lenses=shuffle(['art','bold','love']);
 /* 심사위원 취향: 작품마다 '한 배우의 한 상황'을 정해 두고, 과반(3명=2명, 4~5명=3명)은 그 안에서 말합니다.
    나머지는 제멋대로(변수). 상황은 장소/유형을 섞어서. */
 const n=h.seats.length,core=n<=3?2:3;
 const A0=pick(actorsList());
 const sit=Math.random()<.5?{kind:'place',value:pick(allPlaces())}:{kind:'type',value:pick(allTypes())};
 const prefs=[{kind:'actor',value:A0},{kind:sit.kind,value:sit.value}];
 if(core>2)prefs.push(Math.random()<.5?{kind:'actor',value:A0}:{kind:sit.kind,value:sit.value});
 while(prefs.length<n){const kind=pick(['actor','place','type']);prefs.push({kind,value:kind==='actor'?pick(actorsList()):kind==='place'?pick(allPlaces()):pick(allTypes())});}
 const mixed=prefs.slice(0,core).concat(shuffle(prefs.slice(core)));
 const order=shuffle(mixed.map((_,i)=>i));
 const P=order.map(i=>mixed[i]);
 return h.seats.map((seat,i)=>{
  const lens=lenses[i%3];
  return {seat,persona:PERSONAS[seat],grade:grades[i],lens,pref:P[i]};
 });
}

let AC=null;
function snd(kind){
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.connect(g);g.connect(AC.destination);
  if(kind==='thud'){o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.2);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);}
  else if(kind==='ding'){o.type='triangle';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);}
  else if(kind==='tick'){o.type='square';o.frequency.setValueAtTime(420,t);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);}
  else {o.type='sawtooth';o.frequency.setValueAtTime(95,t);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);}
  o.start(t);o.stop(t+.3);
 }catch(e){}
}

const tierOf=c=>typeInfo(c.type).tier||0;
function slotRoles(n){
 if(n<=1)return ['절정'];if(n===2)return ['도입','절정'];if(n===3)return ['도입','절정','여운'];
 const a=['도입'];for(let i=1;i<n-2;i++)a.push('전개');a.push('절정','여운');return a;
}
function arcScore(cuts){
 const n=cuts.length,roles=slotRoles(n),pi=roles.indexOf('절정'),T=cuts.map(tierOf),mx=Math.max(0,...T);
 const P={};let got=0,W=0;
 P.peak=mx===0?3:6*(T[pi]/mx);W+=6;got+=P.peak;
 if(n>=2){P.open=T[0]<T[pi]?3:T[0]===T[pi]?1.5:0;W+=3;got+=P.open;}
 if(n>=4&&pi>=2){let ok=0;for(let k=0;k<pi;k++)if(T[k+1]>=T[k])ok++;P.rise=4*ok/pi;W+=4;got+=P.rise;}
 if(n>=3){const g=n-1;P.glow=T[g]<T[pi]?2:T[g]===T[pi]?1:0;W+=2;got+=P.glow;}
 return {score:15*got/W,parts:P,roles,pi,peakOk:mx===0||T[pi]>=mx};
}
function scoreFilm(F){
 const cuts=F.edit,N=cuts.length,main=F.mainType;
 const mainCount=cuts.filter(c=>c.type===main).length;
 let compat=20*Math.min(1,mainCount/Math.max(1,F.req));
 const spec=(A(F.actor).uses[main]||0)>=3;
 if(spec)compat+=3;
 let runs=0,run=1,changes=0;
 for(let i=1;i<N;i++){
  if(cuts[i].type===cuts[i-1].type){run++;}else{if(run>=3)runs++;run=1;changes++;}
 }
 if(run>=3)runs++;
 const distinct=new Set(cuts.map(c=>c.type)).size;
 const hoheup=N>=6&&changes>=N-1;
 const arc=arcScore(cuts);
 let comp=arc.score-2*runs-(distinct<2?3:0)-(hoheup?2:0);
 comp=clamp(comp,0,15);
 let pen=0;
 for(const c of cuts)pen+=Math.min(3,S.usage[c.id]||0)*1.2;
 const combo=`${F.actor}|${F.place}|${main}`;
 pen+=2*S.combos.slice(-3).filter(x=>x===combo).length;
 const fresh=clamp(15-pen,0,15);
 /* 숨은 시너지(장소×주력 유형) */
 const key=synKey(F.place,main),kind=synKind(F.place,main),known=!!(S.dex&&S.dex[key]);
 const syn={key,kind,name:synName(F.place,main),first:!known,pts:kind==='hit'?(known?5:8):kind==='bad'?-5:(known?0:2)};
 /* 심사위원별 별점 */
 const maxT=Math.max(0,...cuts.map(tierOf));
 const lensScore={art:(comp/15+fresh/15)/2,bold:.6*Math.min(1,maxT/3)+.4*Math.min(1,(distinct-1)/3),love:Math.min(1,compat/23)};
 let wsum=0,tsum=0;const jstars=[];
 for(const j of F.judges){
  let m;
  if(j.pref.kind==='actor')m=clamp(cuts.filter(c=>c.actor===j.pref.value).length/Math.ceil(N/3),.15,1);
  else if(j.pref.kind==='place')m=j.pref.value===F.place?1:.15;
  else{const k=cuts.filter(c=>c.type===j.pref.value).length;m=clamp(k/Math.ceil(N/3),.05,1);}
  const L=j.lens||'art',sj=clamp(.5*m+.5*lensScore[L],0,1);
  wsum+=j.grade;tsum+=j.grade*sj;
  jstars.push({j,lens:L,m,sj,stars:clamp(Math.round(1+9*sj),1,10)});
 }
 const taste=25*(wsum?tsum/wsum:0);
 const writer=WRITERS.find(w=>w.id===F.writer).bonus;
 const luck=rnd(-4,4);
 const raw=clamp(compat+comp+fresh+taste+writer+syn.pts+luck,0,100),prod=raw*.9,total=Math.round(prod);
 const band=total<35?'최하':total<50?'하':total<65?'중':total<80?'상':'최상';
 return {total,prod,scr:0,band,compat,comp,fresh,taste,writer,luck,syn,jstars,arc,mainCount,spec,flags:{runs,hoheup},distinct};
}
function reviewLines(F,r){
 const o={actor:F.actor,place:F.place},N=F.edit.length;
 const L=[{t:fill(pick(TEXT.critic[r.band]),o)}];
 let tk=null;
 if(r.flags.hoheup)tk='ho';else if(r.flags.runs)tk='ang';else if(!r.arc.peakOk||(r.arc.parts.peak!=null&&r.arc.parts.peak<4))tk='peak';else if(r.arc.parts.glow===0)tk='glow';else if(r.fresh<8)tk='mov';else if(Math.random()<.5)tk='teeth';
 if(tk)L.push({t:fill(pick(TEXT.nitpick[tk]),o),s:'딴지'});
 else if(r.comp>=12)L.push({t:pick(TEXT.arcGood),s:'평론가 메모'});
 const good=r.total>=65,B=TEXT.bluff;
 const n=rnd(1,N);
 const pool=good?[...B.eyeGood,...B.poseGood]:[...B.eyeBad,...B.poseBad];
 L.push({t:fill(pick(pool),{...o,n}),s:'평론가 메모'});
 if(Math.random()<.45)L.push({t:fill(pick([...B.face,...B.lie]),{...o,n:rnd(1,N)}),s:'평론가 메모'});
 return L;
}

function genFor(m,n0){
 const F=R.film,lead=m===F.actor;
 const main=lead?cutsOf(m,F.place,F.mainType):CUTS.filter(c=>c.actor===m&&c.type===F.mainType&&unlocked(m,c.type));
 const others=CUTS.filter(c=>c.actor===m&&(lead?c.place===F.place:true)&&c.type!==F.mainType&&unlocked(m,c.type));
 const n=Math.min(n0,main.length+others.length);
 const nm=Math.min(main.length,Math.ceil(n*.6));
 let cands=shuffle(main.slice()).slice(0,nm);
 cands=cands.concat(shuffle(others.slice()).slice(0,n-cands.length));
 if(cands.length<n)cands=cands.concat(shuffle(main.filter(c=>!cands.includes(c))).slice(0,n-cands.length));
 return cands;
}
function doShoot(){
 const F=R.film;
 let cands=genFor(F.actor,candsNow(F.actor));
 for(const m of F.cast)cands=cands.concat(genFor(m,Math.max(3,Math.ceil(candsNow(m)*.5))));
 F.cands=shuffle(cands);
 F.slots=Math.min(slotsNow(),F.cands.length);
 F.req=Math.min(Math.ceil(F.slots*.6),F.cands.filter(c=>c.type===F.mainType).length);
 F.edit=[];
 R.shootReady=false;
 setTimeout(()=>{if(R.screen==='shoot'){R.shootReady=true;render();}},1500);
}

/* 세로 이미지를 스크린 폭에 꽉 채워 위→아래 / 아래→위로 흘려 보냄 (가로 이미지는 좌우) */
function panCut(c,idx,D){D=D||PAN_MS;
 const host=$('#scrIn');if(!host)return Promise.resolve(D);
 const cw=host.clientWidth,ch=host.clientHeight;
 const slide=document.createElement('div');slide.className='slide';
 const cap=document.createElement('span');cap.className='cap2';cap.textContent=`제${idx+1}컷`;
 const old=[...host.children];host.appendChild(slide);slide.style.animation='xin .5s ease-out';old.forEach(o=>{o.style.transition='opacity .5s';o.style.opacity='0';setTimeout(()=>o.remove(),540);});
 let el;
 const go=(nw,nh,dur)=>{
  const sc=Math.max(cw/nw,ch/nh),w=nw*sc,h=nh*sc;
  el.style.width=w+'px';el.style.height=h+'px';
  const dx=Math.min(0,cw-w),dy=Math.min(0,ch-h);
  const rev=idx%2===1;
  let a,b;
  if(Math.abs(dy)>=Math.abs(dx)){a=`translate(${dx/2}px,${rev?dy:0}px)`;b=`translate(${dx/2}px,${rev?0:dy}px)`;}
  else{a=`translate(${rev?dx:0}px,${dy/2}px)`;b=`translate(${rev?0:dx}px,${dy/2}px)`;}
  try{el.animate([{transform:a},{transform:b}],{duration:dur,easing:'linear',fill:'forwards'});}catch(e){el.style.transform=b;}
 };
 return new Promise(res=>{
  if(c.src&&c.kind==='video'){
   /* 영상: 3.2초보다 짧으면 반복, 8초보다 길면 8초에서 끊음 */
   el=document.createElement('video');el.className='pan';el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;
   el.setAttribute('playsinline','');el.setAttribute('muted','');
   let done=false;
   const start=()=>{if(done)return;done=true;
    const d=isFinite(el.duration)&&el.duration>0?el.duration*1000:D;
    const dur=D;
    go(el.videoWidth||3,el.videoHeight||4,dur);
    try{const p=el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
    res(dur);};
   el.onloadedmetadata=start;
   el.onerror=()=>{if(!done){done=true;go(3,4,D);res(D);}};
   setTimeout(start,1500);
   slide.appendChild(el);el.src=c.src;
  }else if(c.src){
   el=new Image();el.className='pan';el.alt='';
   el.onload=()=>go(el.naturalWidth||3,el.naturalHeight||4,D);
   slide.appendChild(el);el.src=c.src;res(D);
  }else{
   el=document.createElement('div');el.className='pan ph';el.style.setProperty('--h',hue(c.type));
   el.innerHTML=`<b>${esc(c.actor)}</b><span>${esc(c.place)} · ${esc(tlabel(c.type))}</span><em>제${c.no}컷 · 가짜 컷</em>`;
   slide.appendChild(el);go(3,4.6,D);res(D);
  }
  slide.appendChild(cap);
 });
}
